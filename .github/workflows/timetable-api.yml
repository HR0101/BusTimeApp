name: Timetable API
on:
  pull_request:
    paths: ['Backend/**', 'BusTimeApp/Shared/BusSchedule.swift', '.github/workflows/timetable-api.yml']
  push:
    branches: [main]
    paths: ['Backend/**', 'BusTimeApp/Shared/BusSchedule.swift', '.github/workflows/timetable-api.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.lock
      - run: pip install -r Backend/requirements.lock
      - run: python Backend/generate_seed.py
      - run: git diff --exit-code Backend/seed.json
      - run: pytest Backend/test_api.py Backend/test_security.py -q
