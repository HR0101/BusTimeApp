name: bustime-api
services:
  api:
    build:
      context: ../..
      dockerfile: Backend/Dockerfile
      network: host
    restart: unless-stopped
    env_file: .env
    environment:
      TIMETABLE_DB_PATH: /data/timetable.sqlite3
    volumes:
      - timetable-data:/data
    network_mode: host
    command: [uvicorn, Backend.main:app, --host, 127.0.0.1, --port, '8000', --proxy-headers, --forwarded-allow-ips, 127.0.0.1, --no-server-header]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=16m,mode=1777,nosuid,noexec']
    pids_limit: 64
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-bus-api.hr0101.dev}
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=8m,mode=1777,nosuid,noexec']
    pids_limit: 64
    mem_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
volumes:
  timetable-data:
  caddy-data:
  caddy-config:
